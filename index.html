<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Space Invaders</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#000;--fg:#7CFC00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,monospace;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{image-rendering:pixelated}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(0,0,0,.84);padding:12px}
h1{margin:0;font-size:26px;letter-spacing:2px}
p{margin:0;font-size:14px;line-height:1.5}
button.m{font:inherit;font-size:16px;color:var(--fg);background:none;border:2px solid var(--fg);padding:11px 16px;min-width:240px;letter-spacing:1px}
button.m:active{background:var(--fg);color:var(--bg)}
#pad{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px;gap:10px}
.c{width:84px;height:84px;box-sizing:border-box;border:3px solid var(--fg);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.9}
.c.on{background:var(--fg);color:var(--bg)}
#fire{flex:1;max-width:150px;border-radius:44px;font-size:20px;letter-spacing:2px}
</style></head><body>
<div id="stage"><canvas id="cv"></canvas>
<div id="menu"><h1 id="ttl">SPACE INVADERS</h1>
<p id="tbl"></p><p id="info"></p>
<button class="m" id="bd"></button><button class="m" id="ba"></button><button class="m" id="bc"></button>
<button class="m" id="go" style="margin-top:6px;font-weight:bold">PLAY</button></div></div>
<div id="pad"><div class="c" id="L">◀</div><div class="c" id="R">▶</div><div class="c" id="fire">FIRE</div></div>
<script>
const W=224,H=256,cv=document.getElementById('cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;
const bc=document.createElement('canvas');bc.width=W;bc.height=H;const bx=bc.getContext('2d',{willReadFrequently:true});
const R8=[
[["...##...","..####..",".######.","##.##.##","########",".#.##.#.","#......#",".#....#."],["...##...","..####..",".######.","##.##.##","########","..#..#..",".#.##.#.","#.#..#.#"]],
[["..#.....#..","...#...#...","..#######..",".##.###.##.","###########","#.#######.#","#.#.....#.#","...##.##..."],["..#.....#..","#..#...#..#","#.#######.#","###.###.###","###########",".#########.","..#.....#..",".#.......#."]],
[["....####....",".##########.","############","###..##..###","############","...##..##...","..##.##.##..","##........##"],["....####....",".##########.","############","###..##..###","############","..###..###..",".##..##..##.","..##....##.."]]];
const CAN=["......#......",".....###.....",".....###.....",".###########.","#############","#############","#############","#############"];
const UFO=["......####......","....########....","..############..",".##.##.##.##.##.","################","..###..##..###..","...#........#..."];
const EXP=[".#...#...#.","..#..#..#..","...#...#...","##.......##","...#...#...","..#..#..#..",".#...#...#."];
const PAL=[{bg:'#000',fg:'#fff',hi:'#fff',ufo:'#fff',ov:1},{bg:'#352879',fg:'#cfc8ff',hi:'#fff',ufo:'#ff8888'},{bg:'#120900',fg:'#ffb000',hi:'#ffe080',ufo:'#ff5030'}];
const DN=['NOVICE','MEDIUM','ARCADE'],TW=[8,11,12],TP=[30,20,10],TY=[0,1,1,2,2];
let pal=0,diff=0,auto=true,spr,P;
function mk(rows,col){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');x.fillStyle=col;rows.forEach((r,y)=>{for(let i=0;i<r.length;i++)if(r[i]=='#')x.fillRect(i,y,1,1)});return c}
function applyPal(){P=PAL[pal];document.documentElement.style.setProperty('--bg',P.bg);document.documentElement.style.setProperty('--fg',P.fg);
spr={al:R8.map(t=>t.map(r=>mk(r,P.fg))),cn:mk(CAN,P.fg),ufo:mk(UFO,P.ufo),ex:mk(EXP,P.fg)};
bd.textContent='LEVEL: '+DN[diff];ba.textContent='AUTOFIRE: '+(auto?'ON':'OFF');bc_.textContent='COLORS: '+['ARCADE','C64','AMBER'][pal];setInfo()}
const bd=document.getElementById('bd'),ba=document.getElementById('ba'),bc_=document.getElementById('bc'),menu=document.getElementById('menu');
bd.onclick=()=>{diff=(diff+1)%3;applyPal()};ba.onclick=()=>{auto=!auto;applyPal()};bc_.onclick=()=>{pal=(pal+1)%3;applyPal()};
let hi=0;try{hi=+localStorage.getItem('si_hi')||0}catch(e){}
function fit(){const s=document.getElementById('stage'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);
const SI=(s,h)=>`<img src="${s.toDataURL()}" height="${h}" style="image-rendering:pixelated;vertical-align:middle">`;
function setInfo(){document.getElementById('tbl').innerHTML='*SCORE ADVANCE TABLE*<br>'+SI(spr.ufo,12)+' = ? MYSTERY<br>'+SI(spr.al[0][0],14)+' = 30 POINTS<br>'+SI(spr.al[1][0],14)+' = 20 POINTS<br>'+SI(spr.al[2][0],14)+' = 10 POINTS';if(st!='over')document.getElementById('info').innerHTML='HI-SCORE '+hi}
// audio
let ac,mi=0;
function snd(f,d,t,v,f2){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);n.gain.setValueAtTime(v,T);n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(T+d)}
// input
const K={l:0,r:0,f:0};let tap=false;
function bind(id,k){const e=document.getElementById(id);e.addEventListener('pointerdown',v=>{v.preventDefault();e.setPointerCapture(v.pointerId);K[k]=1;e.classList.add('on');if(k=='f')tap=true});['pointerup','pointercancel'].forEach(n=>e.addEventListener(n,()=>{K[k]=0;e.classList.remove('on')}))}
bind('L','l');bind('R','r');bind('fire','f');
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',' ':'f'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){K[k]=1;if(k=='f'&&!e.repeat)tap=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
// game
const UT=[100,50,50,100,150,100,100,50,300,100,100,100,50,150,100];let shots=0;let st='menu',score,lives,level,xn,xs,al,ax,ay,sy,dir,edge,tick,fr,alive,pb,ab,ufo,ufoT,fx,px,dieT,inv,clr;
function bunkers(){bx.clearRect(0,0,W,H);bx.fillStyle=P.fg;for(let b=0;b<4;b++)for(let y=0;y<16;y++)for(let x=0;x<22;x++){if(y==0&&(x<4||x>17))continue;if(y==1&&(x<2||x>19))continue;if(y>=11&&x>=6&&x<=15)continue;bx.fillRect(32+b*46+x,184+y,1,1)}}
function newWave(){al=Array.from({length:5},()=>Array(11).fill(1));sy=56+Math.min(level,5)*8;ax=24;ay=sy;dir=1;edge=false;tick=0;fr=0;alive=55;pb=null;ab=[];ufo=null;ufoT=600+Math.random()*600|0;fx=[];bunkers();px=W/2}
function start(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
shots=0;score=0;lives=3;level=0;xn=[1000,1500,1500][diff];xs=[2000,3000,0][diff];inv=false;newWave();st='play';menu.style.display='none'}
document.getElementById('go').onclick=start;
function over(){st='over';if(score>hi){hi=score;try{localStorage.setItem('si_hi',hi)}catch(e){}}
document.getElementById('ttl').textContent='GAME OVER';document.getElementById('info').innerHTML='SCORE '+score+'<br>HI '+hi;menu.style.display='flex'}
function hit(){st='dying';dieT=90;ab=[];pb=null;lives--;snd(160,.9,'sawtooth',.1,30)}
function bh(x,y){return x>=0&&x<W&&y>=0&&y<H&&bx.getImageData(x|0,y|0,1,1).data[3]>0}
function erode(x,y){bx.clearRect(x-3,y-3,7,6);for(let i=0;i<7;i++)bx.clearRect(x-5+Math.random()*10|0,y-5+Math.random()*10|0,2,2)}
function pts(n,x,y){score+=n;fx.push({t:30,x,y,s:''+n});if(lives<9&&score>=xn){lives++;xn=xs?xn+xs:1e9;snd(600,.25,'square',.05,1200)}}
function update(){
if(st=='dying'){if(--dieT<=0){if(lives<=0)return over();if(inv){inv=false;ax=24;ay=sy;dir=1;edge=false}st='play'}return}
if(st=='clear'){if(--clr<=0){level++;newWave();st='play'}return}
if(st!='play')return;
px=Math.max(8,Math.min(W-8,px+(K.r-K.l)*1.6));
if(!pb&&(tap||(auto&&K.f))){shots++;pb={x:Math.round(px),y:222};snd(900,.12,'square',.05,200)}tap=false;
for(let k=0;k<4&&pb;k++){pb.y--;
if(pb.y<26){pb=null;break}
if(bh(pb.x,pb.y)){erode(pb.x,pb.y);pb=null;break}
if(ufo&&pb.x>=ufo.x&&pb.x<ufo.x+16&&pb.y>=30&&pb.y<37){const p=UT[shots%15];fx.push({t:14,x:ufo.x,y:30,e:1});pts(p,ufo.x,30);ufo=null;pb=null;snd(300,.4,'sawtooth',.07,60);break}
outer:for(let r=0;r<5;r++)for(let c=0;c<11;c++){if(!al[r][c])continue;const t=TY[r],w=TW[t],x0=ax+c*16+(16-w)/2,y0=ay+r*16;
if(pb.x>=x0&&pb.x<x0+w&&pb.y>=y0&&pb.y<y0+8){al[r][c]=0;alive--;fx.push({t:12,x:x0-1,y:y0,e:1});pts(TP[t],x0,y0);pb=null;snd(300,.15,'sawtooth',.06,60);break outer}}
if(!alive){st='clear';clr=70;ab=[];pb=null;return}}
// march
if(++tick>=Math.max(1,Math.round(alive*.5-level))){tick=0;fr^=1;snd([82,73,65,61][mi++&3],.1,'square',.1);
if(edge){ay+=8;dir=-dir;edge=false}else ax+=dir*(alive==1?3:2);
let lo=11,hiC=-1,low=-1;for(let r=0;r<5;r++)for(let c=0;c<11;c++)if(al[r][c]){lo=Math.min(lo,c);hiC=Math.max(hiC,c);low=Math.max(low,r)}
if((dir>0&&ax+hiC*16+14>=W-6)||(dir<0&&ax+lo*16+2<=6))edge=true;
for(let r=0;r<5;r++){if(ay+r*16+8>184)for(let c=0;c<11;c++)if(al[r][c])bx.clearRect(ax+c*16,ay+r*16,16,8)}
if(ay+low*16+8>=216){if(diff==2){lives=0;hit()}else{inv=true;hit()}return}}
// alien fire
if(ab.length<3&&Math.random()<.012+level*.002+(alive<20?.01:0)){const cs=[];for(let c=0;c<11;c++)for(let r=4;r>=0;r--)if(al[r][c]){cs.push([r,c]);break}
const [r,c]=cs[Math.random()*cs.length|0];ab.push({x:ax+c*16+8,y:ay+r*16+8,f:0})}
for(let i=ab.length-1;i>=0;i--){const b=ab[i];let dead=false;b.f++;
for(let k=0;k<2&&!dead;k++){b.y++;
if(pb&&Math.abs(b.x-pb.x)<=2&&Math.abs(b.y-pb.y)<=4){pb=null;dead=true;break}
if(bh(b.x,b.y)){erode(b.x,b.y);dead=true;break}
if(b.y>=224&&b.y<=232&&Math.abs(b.x-px)<=7){dead=true;hit();return}
if(b.y>=240)dead=true}
if(dead)ab.splice(i,1)}
// ufo
if(ufo){ufo.x+=ufo.d*.8;if(ufo.x<-16||ufo.x>W)ufo=null;else if((ufo.x*1.25|0)%4==0)snd((ufo.x*1.25|0)%8==0?880:620,.05,'sine',.04)}
else if(--ufoT<=0&&alive>=8){const d=Math.random()<.5?1:-1;ufo={x:d>0?-16:W,d};ufoT=1200+Math.random()*600|0}
fx=fx.filter(f=>--f.t>0)}
function txt(s,x,y,c,a){g.fillStyle=c;g.textAlign=a||'left';g.fillText(s,x,y)}
function draw(){g.fillStyle=P.bg;g.fillRect(0,0,W,H);g.font='bold 9px ui-monospace,Menlo,monospace';
if(!st||st=='menu'&&!al){txt('SPACE INVADERS',W/2,128,P.fg,'center');return}
txt('SCORE<1>',8,10,P.hi);txt(String(score).padStart(4,'0'),8,20,P.fg);txt('HI-SCORE',88,10,P.hi);txt(String(hi).padStart(4,'0'),88,20,P.fg);txt('LV '+(level+1),176,10,P.hi);
g.fillStyle=P.fg;g.fillRect(0,240,W,1);g.drawImage(bc,0,0);
for(let r=0;r<5;r++)for(let c=0;c<11;c++)if(al[r][c]){const t=TY[r];g.drawImage(spr.al[t][fr],Math.round(ax+c*16+(16-TW[t])/2),Math.round(ay+r*16))}
if(ufo)g.drawImage(spr.ufo,Math.round(ufo.x),30);
if(st!='dying'||(dieT>>2&1)==0&&false)g.drawImage(spr.cn,Math.round(px-6.5),224);
else{g.fillStyle=P.fg;for(let i=0;i<22;i++)g.fillRect(px-7+Math.random()*14|0,224+Math.random()*8|0,2,2)}
g.fillStyle=P.fg;if(pb)g.fillRect(pb.x,pb.y,1,5);
ab.forEach(b=>{g.fillRect(b.x-1+(b.f>>2&1),b.y-3,2,3);g.fillRect(b.x-(b.f>>2&1),b.y,2,3)});
fx.forEach(f=>{if(f.e)g.drawImage(spr.ex,Math.round(f.x),Math.round(f.y));else txt(f.s,f.x,f.y+8,P.hi)});
txt(String(Math.max(lives,0)),8,251,P.hi);for(let i=0;i<lives-1;i++)g.drawImage(spr.cn,22+i*16,244);if(P.ov){g.globalCompositeOperation='multiply';g.fillStyle='#f00';g.fillRect(0,26,W,16);g.fillStyle='#0f0';g.fillRect(0,182,W,H-182);g.globalCompositeOperation='source-over'}}
let last=0,acc=0;
function loop(t){const dt=Math.min(50,t-last);last=t;acc+=dt;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350)e.preventDefault();lt=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
applyPal();fit();
newWave();score=0;lives=3;level=0;xn=1e9;xs=0;st='menu';requestAnimationFrame(loop);setTimeout(fit,100);
</script></body></html>
